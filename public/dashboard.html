<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Somali Media CyberSafe — Live Results</title>

  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

<header>
  <div>
    <h1>📊 Somali Media CyberSafe — Live Results</h1>
    <p class="sub">Anonymous aggregate results</p>
  </div>

  <div class="forum">
    Strategic Communication Forum 2026
  </div>
</header>

<main class="container">

  <!-- 1. PHISHING -->
  <div class="dash-grid" style="margin-top:20px">

    <div class="card">
      <h2>🔐 1. Phishing Simulation</h2>
      <div id="phBars"></div>
    </div>

    <!-- 2. AI VERIFICATION -->
    <div class="card">
      <h2>🤖 2. AI Verification</h2>
      <div id="aiBars"></div>
    </div>

  </div>

  <!-- 3. CYBER SAFETY -->
  <div class="card" style="margin-top:20px">

    <h2>🛡️ 3. Cyber Safety Check</h2>

    <div id="securityBars"></div>

  </div>

</main>

<footer>
  Live anonymous results • Refreshes automatically
</footer>

<script>

const socket = io();

function bars(obj, id, labels = {
  A: 'A',
  B: 'B',
  C: 'C'
}) {

  let total =
    Object.values(obj).reduce((a, b) => a + b, 0) || 1;

  document.getElementById(id).innerHTML =
    Object.keys(labels).map(k => {

      let p = Math.round((obj[k] / total) * 100);

      let cls =
        k === 'B'
          ? 'correct'
          : (k === 'A' || k === 'C'
              ? 'danger'
              : '');

      return `
        <div class="barrow">

          <div class="barlabel">
            <b>${labels[k]}</b>
            <span>${obj[k]} (${p}%)</span>
          </div>

          <div class="bar">
            <div
              class="fill ${cls}"
              style="width:${p}%">
            </div>
          </div>

        </div>
      `;

    }).join('');
}


function render(s) {

  bars(
    s.phishing,
    'phBars'
  );

  bars(
    s.ai,
    'aiBars'
  );

  bars(
    s.security,
    'securityBars',
    {
      0: '0%',
      20: '20%',
      40: '40%',
      60: '60%',
      80: '80%',
      100: '100%'
    }
  );

}


socket.on('state', render);

</script>

</body>
</html>
